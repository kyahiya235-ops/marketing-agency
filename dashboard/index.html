<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agency Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1FF; --surface:#FFFFFF; --ink:#1B1340; --muted:#6A6490; --line:#E1DBF7;
  --hero:#2A1B7A; --hero2:#5B35E8;
  --ok:#0FB98E; --ok-bg:#D4F5EA; --partial:#E89A00; --partial-bg:#FFEBC2; --failed:#F0445B; --failed-bg:#FFD9DE; --other:#3C7BFF; --other-bg:#DCE7FF;
  --shadow:0 6px 18px rgba(60,40,160,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#120C2E; --surface:#1D1545; --ink:#F1EEFF; --muted:#A9A2D6; --line:#32286B;
    --hero:#1B1050; --hero2:#4326C9; --ok:#3EE0B3; --ok-bg:#0F3B33; --partial:#FFC04D; --partial-bg:#47360C;
    --failed:#FF7A8C; --failed-bg:#4D1B27; --other:#7FA8FF; --other-bg:#1C2C5C; --shadow:none; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif;
  padding-bottom:max(40px,env(safe-area-inset-bottom))}
h1,h2,h3,.big{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* hero */
.hero{background:linear-gradient(120deg,var(--hero) 0%,var(--hero2) 70%,#8A5CFF 100%);color:#fff;
  padding:max(26px,env(safe-area-inset-top)) 0 90px;border-radius:0 0 36px 36px}
.hero .wrap{display:flex;flex-wrap:wrap;gap:24px 40px;justify-content:space-between;align-items:flex-end}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:8px 0 0;opacity:.85;max-width:46ch}
.clock{text-align:right}
.clock .big{font-size:clamp(40px,8vw,68px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock small{display:block;opacity:.85;font-size:14px}
.clock .zone{display:inline-block;background:#FFC233;color:#1B1340;font:700 12px Sora,sans-serif;padding:3px 10px;border-radius:99px;margin-bottom:6px}

/* stat tiles overlap hero */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:-62px}
.tile{border-radius:18px;padding:16px 18px;color:#fff;box-shadow:var(--shadow)}
.tile b{display:block;font:800 36px/1 Sora,sans-serif}
.tile span{font-size:14px;opacity:.92}
.t1{background:#5B35E8}.t2{background:#0FB98E}.t3{background:#F5A400;color:#2B1D00}.t4{background:#F0445B}

section{margin-top:40px}
h2{font-size:22px;font-weight:700;margin-bottom:16px}
.two{display:grid;grid-template-columns:260px 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.donut{width:150px;height:150px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center}
.donut i{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 24px Sora,sans-serif;font-style:normal}
.key{display:flex;flex-direction:column;gap:6px;font-size:14px}
.key span{display:flex;align-items:center;gap:8px}.key i{width:12px;height:12px;border-radius:4px;display:inline-block}
.next{display:flex;flex-direction:column;gap:10px}
.next h3{font-size:16px;margin-bottom:2px}
.nrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.nrow .tm{font:700 15px Sora,sans-serif;min-width:58px;font-variant-numeric:tabular-nums}
.nrow small{color:var(--muted)}

/* team */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.card::before{content:"";height:7px;margin:0 -16px 6px;background:var(--c)}
.who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 15px Sora,sans-serif;flex:none}
.who h3{font-size:15px;font-weight:700;word-break:break-word}
.role{color:var(--muted);font-size:13px}
.task{font-size:14px}
.meta{color:var(--muted);font-size:12.5px;margin-top:auto;padding-top:6px}
.pmtag{font:700 11px Sora,sans-serif;background:var(--c);color:#fff;border-radius:99px;padding:2px 8px;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;width:fit-content;background:var(--other-bg);color:var(--other)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.partial{background:var(--partial-bg);color:var(--partial)}.badge.failed{background:var(--failed-bg);color:var(--failed)}

/* log */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 13px Sora,sans-serif;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.dotname{display:inline-flex;align-items:center;gap:8px;font-weight:500}.dotname i{width:10px;height:10px;border-radius:50%;background:var(--c)}

.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.file{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;display:block;box-shadow:var(--shadow)}
.file b{display:block;word-break:break-all}.file span{color:var(--muted);font-size:13px}
pre.brief{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;font:14px/1.6 "DM Sans",sans-serif;margin:0;max-height:480px;overflow:auto}
dialog{width:min(900px,94vw);max-height:86vh;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(20,10,60,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh button{font:inherit;font-weight:700;padding:6px 16px;border:0;background:var(--hero2);color:#fff;border-radius:10px;cursor:pointer}
dialog pre{margin:0;padding:16px;overflow:auto;max-height:70vh;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.empty{color:var(--muted);padding:16px}
footer{margin-top:44px;color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid #FFC233;outline-offset:2px}
@media (max-width:760px){.two{grid-template-columns:1fr}.clock{text-align:left}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div>
    <h1 id="title">Agency Dashboard</h1>
    <p id="sub">Loading…</p>
  </div>
  <div class="clock" aria-label="Current time in Riga">
    <span class="zone" id="zone">Riga time</span>
    <div class="big" id="clk">--:--:--</div>
    <small id="clkdate"></small>
  </div>
</div></div>

<div class="wrap">
  <div class="tiles" id="tally"></div>

  <section>
    <div class="two">
      <div class="panel"><h3 style="margin-bottom:12px">Run results</h3>
        <div class="donut" id="donut"><i id="donutn">0</i></div><div class="key" id="key"></div></div>
      <div class="panel next"><h3>Daily schedule (Riga time)</h3><div id="sched"></div></div>
    </div>
  </section>

  <section><h2>The team</h2><div class="grid" id="team"></div></section>

  <section>
    <h2>Run log</h2>
    <div class="tools">
      <select id="fAgent" aria-label="Filter by agent"><option value="">All agents</option></select>
      <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option></select>
      <input id="fText" type="search" placeholder="Search tasks" aria-label="Search tasks">
    </div>
    <div class="tablebox"><table>
      <thead><tr><th>Time (Riga)</th><th>Agent</th><th>Task performed</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <section><h2>Latest daily brief</h2><div id="brief"></div></section>
  <section><h2>Employee outputs</h2><div class="files" id="files"></div></section>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <div class="dh"><strong id="dname"></strong><button id="dclose">Close</button></div>
  <pre id="dbody"></pre>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "Europe/Riga", SRC_TZ = "Asia/Karachi", SRC_OFFSET = "+05:00"; // schedules in data.json are Karachi time
const COLORS = ["#5B35E8","#0FB98E","#FF5A5F","#F5A400","#2D9CFF","#E040A0","#14B8C9","#8BC34A","#FF7A2F"];
const cls = (s) => ["ok","partial","failed"].includes(s) ? s : "";
const STATUS_COLOR = { ok:"#0FB98E", partial:"#F5A400", failed:"#F0445B" };
const riga = (t, o) => { const d = new Date(t); return isNaN(d) ? String(t || "never") : d.toLocaleString("en-GB", { timeZone: TZ, ...o }); };
const fmt = (t) => t ? riga(t, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }) : "never";
const initials = (id) => id.split("-").slice(0, 2).map((w) => w[0].toUpperCase()).join("");
let colorOf = () => COLORS[0];

function tick() {
  const n = new Date();
  $("clk").textContent = n.toLocaleTimeString("en-GB", { timeZone: TZ, hour12: false });
  $("clkdate").textContent = n.toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
tick(); setInterval(tick, 1000);

// "weekdays 18:00" (Karachi) -> "weekdays 15:00" (Riga), DST-safe because it converts a real date
function toRigaSchedule(sch) {
  const m = /(\d{1,2}):(\d{2})/.exec(sch || ""); if (!m) return { text: sch || "", time: "" };
  const day = new Date().toLocaleDateString("sv-SE", { timeZone: SRC_TZ });
  const at = new Date(`${day}T${m[1].padStart(2, "0")}:${m[2]}:00${SRC_OFFSET}`);
  const time = at.toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  return { text: sch.replace(m[0], time), time };
}

fetch("data.json?t=" + Date.now()).then((r) => r.json()).then(render).catch(() => {
  $("sub").textContent = "Could not load data.json. Put data.json next to index.html and redeploy.";
});

function render(d) {
  document.title = d.agency + " Dashboard";
  $("title").textContent = d.agency;
  $("sub").textContent = [d.brand, "Updated " + fmt(d.generatedAt) + " Riga time"].filter(Boolean).join("  |  ");
  const ids = d.employees.map((e) => e.id);
  colorOf = (id) => COLORS[Math.max(0, ids.indexOf(id)) % COLORS.length];

  const c = d.counts || {}, total = d.runs.length;
  const tiles = [["t1", total, "Runs logged"], ["t2", c.ok || 0, "Finished OK"], ["t3", c.partial || 0, "Need review"], ["t4", c.failed || 0, "Failed"]];
  $("tally").innerHTML = tiles.map(([k, v, l]) => `<div class="tile ${k}"><b>${v}</b><span>${l}</span></div>`).join("");

  // donut
  const parts = ["ok", "partial", "failed"].map((s) => [s, c[s] || 0]).filter(([, n]) => n);
  let acc = 0;
  const stops = parts.map(([s, n]) => { const a = acc, b = acc + (n / total) * 100; acc = b; return `${STATUS_COLOR[s]} ${a}% ${b}%`; });
  $("donut").style.background = stops.length ? `conic-gradient(${stops.join(",")})` : "var(--line)";
  $("donutn").textContent = total ? Math.round(((c.ok || 0) / total) * 100) + "%" : "–";
  $("key").innerHTML = ["ok", "partial", "failed"].map((s) => `<span><i style="background:${STATUS_COLOR[s]}"></i>${s}: <b>${c[s] || 0}</b></span>`).join("");

  // schedule list in Riga time
  const sched = d.employees.map((e) => ({ e, ...toRigaSchedule(e.schedule) })).sort((a, b) => a.time.localeCompare(b.time));
  $("sched").innerHTML = sched.map(({ e, time }) =>
    `<div class="nrow"><span class="tm" style="color:${colorOf(e.id)}">${esc(time || "–")}</span><div><b>${esc(e.id)}</b><br><small>${esc(e.routine)}</small></div></div>`).join("");

  $("team").innerHTML = d.employees.map((e) => `
    <article class="card" style="--c:${colorOf(e.id)}">
      <div class="who"><div class="av">${esc(initials(e.id))}</div><div><h3>${esc(e.id)}</h3><div class="role">${esc(e.role)}</div></div>${e.isProjectManager ? '<span class="pmtag">Manager</span>' : ""}</div>
      <span class="badge ${cls(e.status)}">${esc(e.status)}</span>
      <div class="task">${esc(e.task)}</div>
      <div class="meta">${esc(toRigaSchedule(e.schedule).text)} (Riga)<br>Last run ${esc(fmt(e.lastRun))}</div>
    </article>`).join("") || '<div class="empty">No employees found.</div>';

  const agents = [...new Set(d.runs.map((r) => r.agent))], statuses = [...new Set(d.runs.map((r) => r.status))];
  $("fAgent").insertAdjacentHTML("beforeend", agents.map((a) => `<option>${esc(a)}</option>`).join(""));
  $("fStatus").insertAdjacentHTML("beforeend", statuses.map((a) => `<option>${esc(a)}</option>`).join(""));
  const draw = () => {
    const a = $("fAgent").value, s = $("fStatus").value, q = $("fText").value.toLowerCase();
    const rows = d.runs.filter((r) => (!a || r.agent === a) && (!s || r.status === s) && (!q || r.task.toLowerCase().includes(q)));
    $("rows").innerHTML = rows.map((r) => `<tr><td class="t">${esc(fmt(r.timestamp))}</td><td><span class="dotname" style="--c:${colorOf(r.agent)}"><i></i>${esc(r.agent)}</span></td><td>${esc(r.task)}</td><td><span class="badge ${cls(r.status)}">${esc(r.status)}</span></td></tr>`).join("")
      || '<tr><td colspan="4" class="empty">No runs match. Clear a filter to see all runs.</td></tr>';
  };
  ["fAgent", "fStatus"].forEach((i) => $(i).onchange = draw); $("fText").oninput = draw; draw();

  $("brief").innerHTML = d.brief ? `<pre class="brief">${esc(d.brief.content)}</pre>` : '<div class="panel empty">No brief yet. The Chief of Staff writes one after the daily run.</div>';

  $("files").innerHTML = (d.outputs || []).map((o, i) => `
    <button class="file" style="--c:${colorOf(o.agent)}" data-i="${i}"><b>${esc(o.file)}</b><span>${esc(o.agent)}  |  ${(o.size / 1024).toFixed(1)} KB</span></button>`).join("")
    || '<div class="panel empty">No output files yet.</div>';
  document.querySelectorAll(".file").forEach((b) => b.onclick = () => {
    const o = d.outputs[b.dataset.i];
    $("dname").textContent = o.file; $("dbody").textContent = o.content + (o.truncated ? "\n\n[truncated]" : ""); $("dlg").showModal();
  });
  $("dclose").onclick = () => $("dlg").close();
  $("foot").textContent = "All times shown in Riga time (Europe/Riga). All data is fictional sample data. Outbound actions stay held for the owner.";
}
</script>
</body>
</html>
